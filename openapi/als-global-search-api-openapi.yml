        "CompartmentFluidGrade" :"string",

        "CompartmentFluidManufacturer":"string",

        "UnitOperation" :"string",

        "UnitSector" :"string",

        "CompartmentCapacity" : 0,

        "UnitLastModified" :"string",

        "CompartmentLastModified" :"string",

        "UnitAge" : 0,

        "SampleFilterAge" : 0,

        "CompartmentAge" : 0,

        "UnitSerialNo" :"string",

        "SampleFluidAge" :"string",

        "FluidConsumption" : Decimal,

        "ProblemCode" :"string",

