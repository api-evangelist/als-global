        "FeedbackWorkOrderNo" :"string",

        "FeedbackDateWorkOrderRaised" :"string",

        "FeedbackDateJobClosed" :"string",

        "FeedbackMeterReading" : 0,

        "FeedbackBy" :"string",

        "ServiceType" : "",

        "SampleReportURL" :"string",

        "ImageURL" :"string",

        "xWater" :"string", //Sample Test Code,this column name is dynamic, it changes based on the criteria and also result may return many Test Code eg {"xCu": "7", "xPb": "1"}

        "xWater_Sev" :"string" //Sample Test Severity,this column name is dynamic, it changes based on the criteria and also result may return many Test Severity eg {"xCu_Sev": "Normal","xPb_Sev": "Normal"}

        }


        Note: Sample Test Codes


        Test Code Severity : Every Test Code has test severity pair, where a "Test Code" suffixed with "_Sev" returns the test code severity result.


        For example, the test code "xK" has a test code severity pair of "xK_Sev"


        {

        "xK" : "5",

        "xK_Sev" : "Normal"

        }


        The following JSON is returned if data is not found:


        {

        "Success" : false,

        "Message" : "string",

        "ErrorCode" : 0, //306 Error Code is returned

        "APIVersion": "string"

        }'
