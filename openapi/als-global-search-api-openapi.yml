openapi: 3.2.0
info:
  title: Als Global Search API
  version: v1
  description: 'Operations tagged Search across 2 of this provider''s published API definitions: als-global-webtrieve-export-swagger.json, als-global-webtrieve-export-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.alstribology.com
tags:
- name: Search
