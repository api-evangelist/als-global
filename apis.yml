aid: als-global

name: ALS

description: 'ALS (ALS Limited, alsglobal.com) is a global provider of laboratory testing, inspection, certification
  and verification solutions, serving environmental, equipment reliability (oil and tribology), food and agrisciences,
  mining and commodities (geochemistry), beauty and personal care, and pharmaceutical and healthcare clients. It
  operates client data portals such as ALS Solutions and Webtrieve, and its Global Integration Platform adds a
  credential-gated API layer to an ALS Solutions account so client registration, LIMS and reporting systems can exchange
  sample registrations, results and certificates; endpoint documentation is provided by client support on activation.'

